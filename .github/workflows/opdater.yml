name: Opdater aktieoversigt

on:
  schedule:
    - cron: "17 * * * 1-5"   # hver time på hverdage (tidspunkt i UTC)
  workflow_dispatch:          # giver en knap til at starte manuelt
  push:
    branches: [main]          # kører også, når du ændrer filer

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opdater
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Copenhagen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer programmer
        run: pip install -r requirements.txt

      - name: Lav oversigten
        run: python dashboard.py --ingen-browser

      - name: Gem signal-loggen
        run: |
          git config user.name "aktie-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signaler.csv || true
          git diff --cached --quiet || (git commit -m "Opdater signal-log" && git push)

      - name: Klargør hjemmesiden
        run: |
          mkdir site
          cp dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
